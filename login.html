<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk | Family Finance</title>
<meta name="theme-color" content="#1f4fd8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/images/icon-192.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">Family Finance</div>
    <h1>Masuk</h1>
    <p class="sub">Kelola keuangan keluarga bersama pasangan.</p>
    <div class="form-error" id="form-error" role="alert" hidden></div>
    <form id="login-form" novalidate>
      <div class="field"><label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field"><label for="password">Kata sandi</label>
        <input id="password" type="password" autocomplete="current-password" required></div>
      <div class="row-between"><span></span>
        <button type="button" class="btn-link" id="reset-btn">Lupa kata sandi?</button></div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Masuk</button>
    </form>
    <p class="auth-foot">Belum punya akun? <a href="register.html">Daftar</a></p>
  </div>
</div>
<script type="module" src="assets/js/auth-pages.js"></script>
</body>
</html>
